name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Quality Gate (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run TypeScript Check
        run: pnpm typecheck

      - name: Run Unit & Invariant Tests
        run: pnpm test

      - name: Verify Production Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: "https://client-portal-three-bay.vercel.app"
          NODE_ENV: "production"
